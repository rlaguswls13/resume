<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포트폴리오 - 이력서</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="page-stage">
        <section class="view-page active" id="resumePage" aria-label="이력서 페이지">
            <div class="container">
                <!-- 왼쪽 사이드바 -->
                <aside class="sidebar">
                    <section class="profile" id="profile"></section>
                    <section class="contact" id="contact"></section>
                    <section class="skills" id="skills"></section>
                    <section class="education" id="education"></section>
                </aside>

                <!-- 가운데: 자기소개 -->
                <section class="introduction">
                    <h2>자기소개</h2>
                    <p class="intro-subtitle" id="introSubtitle"></p>
                    <div class="cards-grid" id="cardsGrid"></div>
                </section>

                <!-- 우측: 경력 + 자격증 -->
                <aside class="right-content">
                    <section class="experience" id="experience"></section>
                    <section class="projects" id="certifications"></section>
                </aside>
            </div>
        </section>

        <section class="view-page" id="summaryPage" aria-label="프로젝트 요약 페이지">
            <div class="summary-wrapper">
                <div class="summary-bookmarks" id="summaryTabs" role="tablist" aria-label="요약 항목"></div>
                <article class="summary-panel" id="summaryContent" role="region" aria-live="polite"></article>
            </div>
        </section>

        <section class="view-page" id="domainPage" aria-label="도메인 지식 페이지">
            <div class="domain-wrapper" id="domainContent"></div>
        </section>
    </main>

    <button class="page-nav-btn page-nav-btn--prev" id="goPrevBtn" type="button" aria-label="이전 페이지로 이동" title="이전 페이지">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 5 5 12 12 19"></polyline>
        </svg>
    </button>

    <button class="page-nav-btn page-nav-btn--next" id="goNextBtn" type="button" aria-label="다음 페이지로 이동" title="다음 페이지">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
    </button>

    <!-- 테마 스위처 -->
    <div class="theme-switcher">
        <span class="theme-label">THEME</span>
        <button class="theme-btn theme-btn--gold active"      data-theme="gold"      title="Warm Gold"              onclick="setTheme('gold')"></button>
        <button class="theme-btn theme-btn--botanical"        data-theme="botanical" title="Botanical Forest"        onclick="setTheme('botanical')"></button>
        <button class="theme-btn theme-btn--ocean"            data-theme="ocean"     title="Deep Ocean"             onclick="setTheme('ocean')"></button>
        <button class="theme-btn theme-btn--charcoal"         data-theme="charcoal"  title="Charcoal &amp; Purple" onclick="setTheme('charcoal')"></button>
    </div>

    <!-- PDF 저장 버튼 -->
    <button class="print-btn" onclick="window.print()" title="PDF로 저장" aria-label="PDF로 저장">
        🖨️
    </button>

    <script src="js/script.js"></script>
</body>
</html>
